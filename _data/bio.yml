normal:
  date:     "June 2017"
  title:    ""
  content: 
    me: "I am an <strong>Associate Professor</strong> at <strong>National Taiwan University (NTU)</strong> with a joint appointment in <strong>the Department of Electrical Engineering</strong> and <strong>the Graduate Institute of Communication Engineering</strong>. Prior to joining NTU, I recently completed my Ph.D. in Computer Science at the University of Southern California, where I worked in the <a href='http://clvrai.com/' target='_blank'>Cognitive Learning for Vision and Robotics Lab (CLVR)</a>. Before that, I received my B.S. degree in Electrical Engineering from NTU. My research interests span <strong>robot learning</strong>, <strong>reinforcement learning</strong>, <strong>program synthesis</strong>, <strong>generative models</strong>, and <strong>foundation models</strong>."
    hiring: "<span style='color: #902a1f;'><strong>Prospective students</strong></span>: I am looking for students interested in robot learning, reinforcement learning, program synthesis, generative models, and foundation models. In particular, I am recruiting <strong>M.S.</strong> and <strong>Ph.D. students</strong> admitted to the Data Science and Smart Networking Group (電信所丙組／資料科學與智慧網路組) at the Graduate Institute of Communication Engineering, the Graduate Institute of AI (人工智慧研究所), or the Data Science Degree Program (資料科學學位學程) at NTU. I also welcome <strong>undergraduate students</strong>, <strong>research assistants</strong>, and <strong>visiting students/researchers</strong> with a range of backgrounds and experience levels. If you are interested in joining my group, please visit the Join Us page on <a href='https://nturll.xyz/'>our lab website</a> and fill out the Google Form."
    lab_web: "<span style='color: #902a1f;'><strong>Lab website</strong></span>: Check out our <a href='https://nturll.netlify.app/about' target='_blank'>lab website</a>!"

visit_lab: "<p>If you are interested in joining my group, you are very welcome to visit my lab at MK-518 (學新館518) to talk to my graduate and undergraduate students to learn about their research topics, my advising style, etc. Note that weekday afternoon usually works best, especially Thursday and Friday afternoons.</p>"
short:
